<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kerala Complaint Portal - Forgot Password</title>
    <!-- Site favicon -->
    <link rel="shortcut icon" href="images/favicon.ico">
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icon Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.5/css/ionicons.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-green: #006400;
            --secondary-green: #228B22;
            --accent-gold: #DAA520;
            --text-dark: #2C3E50;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Kerala culture background image */
            background-image: url('https://images.pexels.com/photos/27869349/pexels-photo-27869349.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1920&h=1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle overlay for better readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 100, 0, 0.4); /* Light green tint to tie into Kerala theme */
            z-index: 1;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95); /* Semi-transparent for depth */
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .header-section {
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.05;
        }

        .portal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .portal-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .gov-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .form-section {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }

        .form-control {
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(0, 100, 0, 0.1);
            background: var(--white);
            transform: translateY(-1px);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            color: var(--white);
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--secondary-green), var(--primary-green));
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            color: var(--white);
        }

        .link-forgot {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .link-forgot:hover {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        .dept-preview {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .dept-icon {
            font-size: 1.5rem;
            color: var(--primary-green);
            transition: transform 0.3s ease;
        }

        .dept-icon:hover {
            transform: scale(1.2);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .portal-title {
                font-size: 2rem;
            }
            .form-section {
                padding: 30px 20px;
            }
            body {
                background-attachment: scroll; /* Better for mobile */
            }
        }

        /* Subtle animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="gov-badge">Government of Kerala</div>
            <h1 class="portal-title">Kerala Complaint Portal</h1>
            <p class="portal-subtitle">Reset Your Password Securely</p>
            <div class="dept-preview">
                <ion-icon name="lock-open" class="dept-icon" title="Password Reset"></ion-icon>
                <ion-icon name="mail" class="dept-icon" title="Email Verification"></ion-icon>
                <ion-icon name="shield-checkmark" class="dept-icon" title="Secure Access"></ion-icon>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <div class="text-center mb-4">
                <p class="lead text-muted">Enter your registered email address below, and we'll send you a link to reset your password.</p>
            </div>
            <form action="/myapp/forget_password/" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="emailid" class="form-control" placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="btn btn-login">Send Reset Link</button>
            </form>
            <div class="text-center mt-3">
                <a href="/myapp/login/" class="link-forgot">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
