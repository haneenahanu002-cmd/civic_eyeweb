
{% extends 'admin/home_index.html' %}
{% block body %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<div class="container mt-5">
    <h3 class="mb-4">View Department</h3>
    <!-- Complaints Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="complaintTable">
        <thead>
          <tr>
            <th>Sl. No.</th>
            <th>Department</th>
            <th>Description</th>
            <th>Email</th>
            <th>Phone</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for i in data %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.dname }}</td>
            <td>{{i.description }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phone }}</td>
            <td><button class="btn btn-sm btn-primary"><a href="/myapp/edit_department/{{ i.id }}#abc" class="text-white text-decoration-none">Edit</a></button>
            <button class="btn btn-sm btn-danger"><a href="/myapp/delete_department/{{ i.USER.id }}" onclick="return confirm('Are you sure?');" class="text-white text-decoration-none"> Delete</a></button></td>
          </tr>
          {% endfor %}
   
        </tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  
  <script>
    $(document).ready(function () {
      $('#complaintTable').DataTable({
        pageLength: 5
      });
    });
  </script>

{% endblock %}
