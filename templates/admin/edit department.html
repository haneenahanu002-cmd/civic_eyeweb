{% extends 'admin/home_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit Department </h2>
    <form method="post" action="/myapp/edit_department_post/#abc">

{% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Department Name</label>
        <div class="col-sm-8">
          <input type="text" name="name" class="form-control" id="name" value="{{ data.dname }}" required>
        </div>
      </div>



      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" name="Email" class="form-control" id="email" value="{{ data.email }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}"name="number" class="form-control" id="phone" value="{{ data.phone }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Description</label>
        <div class="col-sm-8">
          <input type="text"name="description" class="form-control" id="description" value="{{ data.description }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">save</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{#</body>#}
{#</html>#}
{% endblock %}
