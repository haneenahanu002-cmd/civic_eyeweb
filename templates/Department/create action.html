{% extends 'Department/home_index.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Create Action</h4>



        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}


    <form action="/myapp/create_action_post/" method="post">
        {% csrf_token %}




      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="complaint" class="form-label">Action</label><input type="hidden" name="id" value="{{ id }}">
        <textarea class="form-control" id="complaint" name="action" rows="4" placeholder="Write your action here..." required></textarea>
      </div>

      <!-- Optional File Upload -->

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{#</body>#}
{#</html>#}
{% endblock %}
