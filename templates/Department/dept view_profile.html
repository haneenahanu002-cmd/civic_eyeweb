

{% extends 'Department/home_index.html' %}

{% block title %}Department - View Profile{% endblock %}

{% block style %}
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #3a8ef6, #72b5f9);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .profile-card {
    background-color: #ffffff;
    border-radius: 15px;
    padding: 30px 25px;
    max-width: 450px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    position: relative;
  }

  .profile-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ffffff;
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #ddd;
  }

  .profile-card h2 {
    margin-top: 60px;
    font-size: 22px;
    color: #333;
  }

  .profile-card .field {
    margin: 15px 0;
    text-align: left;
  }

  .field-label {
    font-weight: 600;
    font-size: 14px;
    color: #666;
  }

  .field-value {
    font-size: 16px;
    color: #222;
    margin-top: 4px;
    background-color: #f7f7f7;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #e2e2e2;
  }

  @media (max-width: 500px) {
    .profile-card {
      margin: 0 20px;
      padding: 25px 20px;
    }
  }
</style>
{% endblock %}

{% block body %}
<div class="profile-card">
  <!-- <img class="profile-img" src="https://via.placeholder.com/100" alt="Profile Picture" /> -->

  <h2>{{ data.dname }}</h2>

  <div class="field">
    <div class="field-label">Description:</div>
    <div class="field-value">{{ data.description }}</div>
  </div>

  <div class="field">
    <div class="field-label">Email:</div>
    <div class="field-value">{{ data.email }}</div>
  </div>

  <div class="field">
    <div class="field-label">Phone:</div>
    <div class="field-value">{{ data.phone }}</div>
  </div>
</div>
{% endblock %}

{#</body>#}
{#</html>#}
{#{% endblock %}#}
